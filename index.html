    <script type="application/ld+json">

      "@graph": [
        {
          "@type": "ClothingStore",

          "url": "https://knbasic.vn",
          "logo": "https://knbasic.vn/img/logo_2026.jpg",
          "image": "https://knbasic.vn/img/hero.jpg",

          "email": "kn.gubasic@gmail.com",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "2825 Ly Thai To, Phu Huu, Dai Phuoc",
            "addressLocality": "Nhon Trach",
            "addressRegion": "Dong Nai",
            "addressCountry": "VN"
          },
          "sameAs": [
            "https://shopee.vn/knbasic",
            "https://www.tiktok.com/@kn.atelier",

            ]

          "url": "https://knbasic.vn",
          "name": "KN Basic – Kylin Novel",
          "description": "Vietnam's minimal menswear local brand",
          "publisher": {
            "@id": "https://knbasic.vn/#organization"
          },
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://knbasic.vn/?q={search_term_string}"

            "query-input": "required name=search_term_string"
